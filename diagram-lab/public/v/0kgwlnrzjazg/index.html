<style>
:root{--ink:#141518;--ink2:#5A5E66;--hair:rgba(20,21,24,.15);--ctl:#767A82;--accent:#FF5A1F;--card:rgba(255,255,255,.82);--bg:#ECEBE8;
  --sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--disp:"Michroma","Manrope",ui-sans-serif,system-ui,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;outline:none}
#c.dragging{cursor:grabbing}#c.hovering{cursor:pointer}
.sc{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.ui{transition:opacity .35s ease}
body.ui-hidden .ui{opacity:0!important;pointer-events:none!important}
/* brand */
#brand{position:fixed;left:28px;top:26px;max-width:min(60vw,760px);pointer-events:none;z-index:3}
#brand .kick{margin:0 0 10px 2px}
#brand h1{display:inline-block;font-family:var(--disp);font-weight:400;font-size:clamp(22px,2.2vw,36px);letter-spacing:.05em;text-transform:uppercase;line-height:1.2;margin:0;color:var(--ink);
  padding:.34em .62em .3em;border-radius:10px;background:rgba(246,245,242,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(20,21,24,.06),0 6px 24px rgba(20,21,24,.06);
  border-left:3px solid var(--accent);text-wrap:balance;transition:opacity .18s ease,transform .18s ease}
#brand p.cap{margin:12px 0 0 2px;font-size:clamp(15px,1.15vw,19px);line-height:1.45;font-weight:500;color:var(--ink);max-width:36em;text-shadow:0 0 12px rgba(246,245,242,.9);transition:opacity .18s ease,transform .18s ease}
#brand .swap{opacity:0;transform:translateY(-4px)}
#fpcLogo{position:fixed;right:28px;bottom:26px;width:104px;height:auto;z-index:3;pointer-events:none;user-select:none}
.card{background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--hair);border-radius:12px}
button:focus-visible,.dot:focus-visible,#c:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{font:600 13px/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--ctl);border-radius:9px;padding:9px 12px;cursor:pointer;min-height:34px}
#pill{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 14px 6px 14px;border-radius:999px;z-index:4;white-space:nowrap}
#pill .num{font-family:var(--disp);font-size:14px;color:var(--ink);min-width:2.6em;text-align:center}
.dots{display:flex;align-items:center}
.dot{width:26px;height:26px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:50%;padding:0}
.dot i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ctl);transition:all .2s;display:block}
.dot:hover i{border-color:var(--ink);transform:scale(1.25)}.dot:active i{transform:scale(.9)}
.dot[aria-current="true"] i{background:var(--accent);border-color:var(--accent);width:10px;height:10px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lab{position:absolute;top:0;left:0;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.86);border:1px solid var(--hair);white-space:nowrap;will-change:transform;transition:opacity .3s}
.lab.sc{color:var(--ink)}
#msg{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:var(--bg)}
#msg.show{display:grid}
#msg .panel{max-width:560px;margin:24px;padding:36px 36px 30px;background:#fff;border:1px solid var(--hair);border-radius:12px}
#msg h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:10px 0 14px}
#msg p,#msg li{font-size:14px;line-height:1.6;color:var(--ink)}
#msg ul{padding-left:18px;margin:10px 0 18px}
#msg code{font-size:13px;background:#F3F2EF;padding:1px 5px;border-radius:4px}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center}
#loading .bar{width:140px;height:2px;background:var(--hair);margin:12px auto 0;overflow:hidden;border-radius:2px}
#loading .bar i{display:block;height:100%;width:40%;background:var(--ink);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

<script>
'use strict';
// ===================== WGSL =====================
const WGSL_COMMON = /* wgsl */`
diagnostic(off, derivative_uniformity);
struct Frame {
  viewProj: mat4x4f,
  view: mat4x4f,
  shadowVP: mat4x4f,
  camPos: vec4f,   // xyz camera, w time
  sun: vec4f,      // xyz dir to key light, w shadow texel world size
  vp: vec4f,       // width, height, near, far
  proj: vec4f,     // tanX, tanY, focus distance, aperture
  bgTop: vec4f,    // display-linear
  bgBot: vec4f,
  hl: vec4f,       // accent rgb, w exposure
  misc: vec4f,     // x active-path phase, y active-path on, z ao radius, w dof amount
};
struct Inst {
  m: mat4x4f,
  color: vec4f,  // rgb base, a recede
  mat: vec4f,    // rough, metal, kind, clearcoat
  emis: vec4f,   // rgb emissive, w highlight mask
  aux: vec4f,    // object id, dim, hatch density, param
  ext: vec4f,    // stripe rgb, active amount
};
fn bgDisplay(d: vec3f) -> vec3f {
  return mix(F.bgBot.rgb, F.bgTop.rgb, smoothstep(-0.02, 0.5, d.y));
}
// inverse of the (near-grey) Khronos PBR Neutral curve, per channel scaled by max
fn invNeutral(y: vec3f) -> vec3f {
  let s = 0.76; let d = 0.24;
  let pk = max(y.r, max(y.g, y.b));
  var peak = pk;
  if (pk > s) { peak = d * d / max(1.0 - pk, 1e-3) - d + s; }
  return y * (peak / max(pk, 1e-4)) + vec3f(0.04);
}
fn neutralTM(cin: vec3f) -> vec3f {
  var c = cin;
  let s = 0.76; let des = 0.15;
  let x = min(c.r, min(c.g, c.b));
  var off = 0.04; if (x < 0.08) { off = x - 6.25 * x * x; }
  c = c - vec3f(off);
  let peak = max(c.r, max(c.g, c.b));
  if (peak < s) { return c; }
  let d = 1.0 - s;
  let np = 1.0 - d * d / (peak + d - s);
  c = c * (np / peak);
  let g = 1.0 - 1.0 / (des * (peak - np) + 1.0);
  return mix(c, vec3f(np), g);
}
fn bgHDR(d: vec3f) -> vec3f { return invNeutral(bgDisplay(d)) / F.hl.w; }
`;

const WGSL_MAIN = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var<storage, read> I: array<Inst>;
@group(0) @binding(2) var shadowTex: texture_depth_2d;
@group(0) @binding(3) var shadowSmp: sampler_comparison;

struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) wpos: vec3f,
  @location(1) nrm: vec3f,
  @location(2) uv: vec2f,
  @location(3) lpos: vec3f,
  @location(4) @interpolate(flat) iid: u32,
};
fn normalMat(m: mat4x4f) -> mat3x3f {
  let c0 = m[0].xyz; let c1 = m[1].xyz; let c2 = m[2].xyz;
  return mat3x3f(cross(c1, c2), cross(c2, c0), cross(c0, c1));
}
@vertex fn vs_main(@location(0) p: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f,
                   @builtin(instance_index) ii: u32) -> VOut {
  let M = I[ii].m;
  let w = M * vec4f(p, 1.0);
  var o: VOut;
  o.pos = F.viewProj * w;
  o.wpos = w.xyz;
  let det = dot(M[0].xyz, cross(M[1].xyz, M[2].xyz));
  o.nrm = normalMat(M) * n * sign(det);
  o.uv = uv; o.lpos = p; o.iid = ii;
  return o;
}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn shadowAt(wp: vec3f, n: vec3f, px: vec2f) -> f32 {
  _ = px;
  let s = F.shadowVP * vec4f(wp + n * F.sun.w * 2.0, 1.0);
  let q = s.xyz / s.w;
  let uv = vec2f(q.x * 0.5 + 0.5, 0.5 - q.y * 0.5);
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0 || q.z > 1.0 || q.z < 0.0) { return 1.0; }
  let texel = 1.0 / f32(textureDimensions(shadowTex).x);
  var sum = 0.0;
  for (var j = 0; j < 4; j++) {
    for (var i = 0; i < 4; i++) {
      let o = (vec2f(f32(i), f32(j)) - 1.5) * 1.5 * texel;
      sum += textureSampleCompareLevel(shadowTex, shadowSmp, uv + o, q.z - 0.0006);
    }
  }
  return sum / 16.0;
}
fn studioEnv(d: vec3f, rough: f32) -> vec3f {
  let soft = 0.025 + rough * rough * 1.1;
  var c = mix(F.bgBot.rgb * 0.62, F.bgBot.rgb * 0.95, smoothstep(-0.5, 0.0, d.y));
  c = mix(c, vec3f(1.0), smoothstep(0.0, 0.7, d.y)) * 0.85;
  if (d.y > 0.0) {
    let q = d.xz / max(d.y, 0.02);
    let bx = 1.0 - smoothstep(0.75 - soft, 0.75 + soft, abs(q.x));
    let bz = 1.0 - smoothstep(1.05 - soft, 1.05 + soft, abs(q.y));
    c += vec3f(4.2) * bx * bz * smoothstep(0.0, 0.25, d.y) * (1.0 - rough * 0.55);
  }
  let hz = atan2(d.x - 0.25, abs(d.z));
  let sw = 1.0 - smoothstep(0.10 + soft * 0.6, 0.16 + soft * 1.2, abs(hz));
  let sv = smoothstep(-0.15 - soft, -0.05, d.y) * (1.0 - smoothstep(0.55, 0.75 + soft, d.y));
  c += vec3f(2.2) * sw * sv * (1.0 - rough * 0.5);
  return c;
}
fn litSurface(wpos: vec3f, N: vec3f, V: vec3f, base: vec3f, rough: f32, metal: f32, cc: f32, emis: vec3f, sh: f32) -> vec3f {
  let viewDir = -V;
  let L = normalize(F.sun.xyz);
    let NoV = max(dot(N, V), 1e-3);
    let F0 = mix(vec3f(0.04), base, metal);
    let c0 = vec4f(-1.0, -0.0275, -0.572, 0.022);
    let c1 = vec4f(1.0, 0.0425, 1.04, -0.04);
    let r = rough * c0 + c1;
    let a004 = min(r.x * r.x, exp2(-9.28 * NoV)) * r.x + r.y;
    let AB = vec2f(-1.04, 1.04) * a004 + r.zw;
    let specCol = F0 * AB.x + AB.y;
    let R = reflect(viewDir, N);
    let specOcc = mix(sh, 1.0, 0.45) * mix(0.55, 1.0, smoothstep(-0.6, 0.2, R.y));
    let spec = studioEnv(R, rough) * specCol * specOcc;
    let hemi = mix(F.bgBot.rgb * 0.42, vec3f(1.0), N.y * 0.5 + 0.5);
    let key = max(dot(N, L), 0.0) * sh * 1.9;
    let strips = 0.32 * (pow(max(N.z, 0.0), 2.0) + pow(max(-N.z, 0.0), 2.0)) + 0.12 * max(N.x, 0.0);
    let diff = base * (1.0 - metal) * (hemi * 0.7 + key + strips);
    let Fc = (0.04 + 0.96 * pow(1.0 - NoV, 5.0)) * cc;
    let coat = studioEnv(R, 0.07) * Fc * specOcc;
  return (diff + spec) * (1.0 - Fc) + coat + emis;
}
struct FOut { @location(0) color: vec4f, @location(1) nd: vec4f };
@fragment fn fs_main(v: VOut, @builtin(front_facing) ff: bool) -> FOut {
  let inst = I[v.iid];
  var N = normalize(v.nrm);
  if (!ff) { N = -N; }
  var base = inst.color.rgb;
  var rough = inst.mat.x;
  var metal = inst.mat.y;
  let kind = u32(inst.mat.z + 0.5);
  var cc = inst.mat.w;
  var emis = inst.emis.rgb;
  let V = normalize(F.camPos.xyz - v.wpos);
  let viewDir = -V;
  // ---- material kinds (derivatives computed up front) ----
  let ht = dot(v.lpos, vec3f(0.57735, 0.57735, -0.57735)) * max(inst.aux.z, 1.0);
  let hfw = fwidth(ht);
  let tg = v.lpos.xz * 160.0;
  let tfw = fwidth(tg);
  if (kind == 1u) { // machined cut face with fine hatch
    let f = abs(fract(ht) - 0.5);
    let line = 1.0 - smoothstep(0.30 - hfw, 0.30 + hfw, 0.5 - f);
    let vis = 1.0 - smoothstep(0.25, 0.6, hfw);
    base = base * mix(1.0, 0.62, line * vis * 0.9 + (1.0 - vis) * 0.25);
  } else if (kind == 2u) { // cable sheath + ID stripe
    let a = fract(v.uv.x);
    let sfw = fwidth(v.uv.x) * 1.5;
    let st = smoothstep(0.0, sfw, a) * (1.0 - smoothstep(0.11 - sfw, 0.11, a));
    base = mix(base, inst.ext.rgb, st);
    let act = inst.ext.w;
    if (act > 0.0) {
      let band = 0.5 + 0.5 * cos((v.uv.y * 0.9 - F.misc.x * 6.2831853) );
      base = mix(base, F.hl.rgb * 0.5, act * (0.06 + 0.10 * band) * (1.0 - st));
    }
  } else if (kind == 6u) { // PCB solder mask with faint traces
    let cell = floor(tg / 6.0);
    let h = fract(sin(dot(cell, vec2f(12.9898, 78.233))) * 43758.5453);
    let lx = abs(fract(tg.x) - 0.5); let ly = abs(fract(tg.y) - 0.5);
    var tr = 0.0;
    if (h > 0.55) { tr = 1.0 - smoothstep(0.12, 0.12 + tfw.x, lx); } else if (h > 0.2) { tr = 1.0 - smoothstep(0.12, 0.12 + tfw.y, ly); }
    tr = tr * (1.0 - smoothstep(0.3, 0.8, max(tfw.x, tfw.y)));
    if (abs(N.y) < 0.5) { tr = 0.0; }
    base = mix(base, base * 1.55 + vec3f(0.01, 0.03, 0.0), tr * 0.6);
  }
  // ---- lighting ----
  let L = normalize(F.sun.xyz);
  let sh = shadowAt(v.wpos, N, v.pos.xy);
  var col = vec3f(0.0);
  if (kind == 3u) { // studio floor = shadow catcher fading to the cyclorama
    let dist = length(v.wpos.xz - vec2f(4.0, 0.0));
    let fade = smoothstep(30.0, 95.0, dist);
    col = bgHDR(viewDir) * mix(mix(0.58, 1.0, sh), 1.0, fade);
  } else if (kind == 5u) { // emissive display element (unlit)
    col = base * 0.08 + emis;
  } else {
    col = litSurface(v.wpos, N, V, base, rough, metal, cc, emis, sh);
    if (kind == 4u) { col = col * 0.6 + emis * 1.2; }
  }
  // dim / recede toward the cyclorama
  let k = clamp(inst.color.a + inst.aux.y * 0.38, 0.0, 0.93);
  col = mix(col, bgHDR(viewDir), k);
  var o: FOut;
  o.color = vec4f(col, 1.0);
  let vn = (F.view * vec4f(N, 0.0)).xyz;
  let vz = -(F.view * vec4f(v.wpos, 1.0)).z;
  o.nd = vec4f(vn.xy, vz, inst.emis.w);
  return o;
}
// ---- logo decals (group 1: premultiplied RGBA atlas + mip chain), alpha-blended over the surface they sit on ----
@group(1) @binding(0) var logoTex: texture_2d<f32>;
@group(1) @binding(1) var logoSmp: sampler;
fn srgbToLin(c: vec3f) -> vec3f { return select(pow((c + 0.055) / 1.055, vec3f(2.4)), c / 12.92, c <= vec3f(0.04045)); }
@fragment fn fs_decal(v: VOut, @builtin(front_facing) ff: bool) -> FOut {
  let inst = I[v.iid];
  let t = textureSample(logoTex, logoSmp, v.uv);
  var N = normalize(v.nrm);
  if (!ff) { N = -N; }
  let V = normalize(F.camPos.xyz - v.wpos);
  let base = srgbToLin(t.rgb / max(t.a, 1e-3));
  let sh = shadowAt(v.wpos, N, v.pos.xy);
  var col = litSurface(v.wpos, N, V, base, inst.mat.x, inst.mat.y, inst.mat.w, vec3f(0.0), sh);
  let k = clamp(inst.color.a + inst.aux.y * 0.38, 0.0, 0.93);
  col = mix(col, bgHDR(-V), k);
  if (t.a < 0.003) { discard; }
  var o: FOut;
  o.color = vec4f(col, t.a);
  o.nd = vec4f(0.0);
  return o;
}
`;

const WGSL_GEO = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var<storage, read> I: array<Inst>;
@vertex fn vs_shadow(@location(0) p: vec3f, @builtin(instance_index) ii: u32) -> @builtin(position) vec4f {
  return F.shadowVP * (I[ii].m * vec4f(p, 1.0));
}
struct IdOut { @builtin(position) pos: vec4f, @location(0) @interpolate(flat) id: u32 };
@vertex fn vs_id(@location(0) p: vec3f, @builtin(instance_index) ii: u32) -> IdOut {
  var o: IdOut;
  o.pos = F.viewProj * (I[ii].m * vec4f(p, 1.0));
  o.id = u32(I[ii].aux.x + 0.5);
  return o;
}
@fragment fn fs_id(v: IdOut) -> @location(0) u32 { return v.id; }
`;

const WGSL_POST = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var hdrTex: texture_2d<f32>;
@group(0) @binding(2) var ndTex: texture_2d<f32>;
@group(0) @binding(3) var aoTex: texture_2d<f32>;
@group(0) @binding(4) var linSmp: sampler;
struct FS { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs_full(@builtin(vertex_index) i: u32) -> FS {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: FS;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
fn viewRay(uv: vec2f) -> vec3f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  let dv = vec3f(ndc.x * F.proj.x, ndc.y * F.proj.y, -1.0);
  let r = vec3f(F.view[0].x, F.view[1].x, F.view[2].x) * dv.x
        + vec3f(F.view[0].y, F.view[1].y, F.view[2].y) * dv.y
        + vec3f(F.view[0].z, F.view[1].z, F.view[2].z) * dv.z;
  return normalize(r);
}
fn ignp(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
// ---------- SSAO (half resolution) ----------
@fragment fn fs_ao(v: FS) -> @location(0) vec4f {
  let full = vec2f(textureDimensions(ndTex));
  let px = vec2i(v.pos.xy * 2.0);
  let nd = textureLoad(ndTex, px, 0);
  if (nd.z <= 0.0) { return vec4f(1.0); }
  let z = nd.z;
  let uv = (vec2f(px) + 0.5) / full;
  let P = vec3f((uv.x * 2.0 - 1.0) * F.proj.x * z, (1.0 - uv.y * 2.0) * F.proj.y * z, -z);
  let N = vec3f(nd.xy, sqrt(max(0.0, 1.0 - dot(nd.xy, nd.xy))));
  let rad = F.misc.z;
  let rpx = clamp(rad / (z * F.proj.y) * full.y * 0.5, 2.0, 80.0);
  let rot = ignp(v.pos.xy) * 6.2831853;
  var occ = 0.0;
  for (var i = 0u; i < 8u; i++) {
    let a = f32(i) * 2.39996323 + rot;
    let t = (f32(i) + 0.5) / 8.0;
    let o = vec2f(cos(a), sin(a)) * rpx * t;
    let sp = clamp(vec2i(vec2f(px) + o), vec2i(0), vec2i(full) - 1);
    let sz = textureLoad(ndTex, sp, 0).z;
    if (sz <= 0.0) { continue; }
    let suv = (vec2f(sp) + 0.5) / full;
    let S = vec3f((suv.x * 2.0 - 1.0) * F.proj.x * sz, (1.0 - suv.y * 2.0) * F.proj.y * sz, -sz);
    let d = S - P;
    let dd = dot(d, d);
    let w = 1.0 - smoothstep(rad * rad * 0.5, rad * rad * 2.0, dd);
    occ += max(0.0, dot(d, N) - 0.01 * z) / (dd + 0.02 * rad * rad) * w;
  }
  let ao = clamp(1.0 - 1.1 * occ / 8.0 * rad, 0.0, 1.0);
  return vec4f(ao, 0.0, 0.0, 1.0);
}
// ---------- composite: AO, gentle DoF, outline, tonemap ----------
fn tapColor(uv: vec2f, nd: vec4f, ao: f32) -> vec3f {
  if (nd.z <= 0.0) { return bgHDR(viewRay(uv)); }
  let h = textureSampleLevel(hdrTex, linSmp, uv, 0.0);
  // MSAA edge pixels: resolved alpha = coverage, so fill the uncovered part with the studio background
  return h.rgb * ao + (1.0 - clamp(h.a, 0.0, 1.0)) * bgHDR(viewRay(uv));
}
fn coc(z: f32, full: vec2f) -> f32 {
  if (z <= 0.0) { return 5.0 * F.misc.w; }
  return clamp(F.proj.w * abs(z - F.proj.z) / max(z, 1e-3) * full.y, 0.0, 6.0) * F.misc.w;
}
fn aoAt(uv: vec2f) -> f32 { return mix(1.0, textureSampleLevel(aoTex, linSmp, uv, 0.0).r, 0.85); }
@fragment fn fs_comp(v: FS) -> @location(0) vec4f {
  let full = vec2f(textureDimensions(ndTex));
  let px = vec2i(v.pos.xy);
  let uv = (v.pos.xy) / full;
  let nd0 = textureLoad(ndTex, px, 0);
  var acc = tapColor(uv, nd0, aoAt(uv));
  var wsum = 1.0;
  let c0 = coc(nd0.z, full);
  if (c0 > 0.6) {
    let rot = ignp(v.pos.xy) * 6.2831853;
    for (var i = 0u; i < 12u; i++) {
      let a = f32(i) * 2.39996323 + rot;
      let r = sqrt((f32(i) + 0.5) / 12.0) * c0;
      let o = vec2f(cos(a), sin(a)) * r;
      let sp = clamp(vec2i(v.pos.xy + o), vec2i(0), vec2i(full) - 1);
      let suv = (vec2f(sp) + 0.5) / full;
      let snd = textureLoad(ndTex, sp, 0);
      let cs = coc(snd.z, full);
      var w = smoothstep(r - 1.0, r + 0.5, max(cs, 0.0) + 0.5);
      if (snd.z > 0.0 && nd0.z > 0.0 && snd.z > nd0.z + 0.5) { w = w * 0.5; }
      acc += tapColor(suv, snd, aoAt(suv)) * w;
      wsum += w;
    }
  }
  var hdr = acc / wsum;
  var outc = neutralTM(hdr * F.hl.w);
  if (nd0.z <= 0.0 && c0 <= 0.6) { outc = bgDisplay(viewRay(uv)); }
  // outline from highlight mask
  let m0 = nd0.w;
  var mx = 0.0;
  let rr = max(1.0, full.y / 700.0) * 1.6;
  for (var i = 0u; i < 8u; i++) {
    let a = f32(i) * 0.785398;
    let sp = clamp(vec2i(v.pos.xy + vec2f(cos(a), sin(a)) * rr), vec2i(0), vec2i(full) - 1);
    mx = max(mx, textureLoad(ndTex, sp, 0).w);
  }
  let edge = clamp((mx - m0) * 1.6, 0.0, 1.0);
  if (edge > 0.01) {
    let strength = select(0.55, 1.0, mx > 0.75);
    outc = mix(outc, F.hl.rgb, edge * strength);
  }
  // sRGB encode
  let c = clamp(outc, vec3f(0.0), vec3f(1.0));
  let lo = c * 12.92;
  let hi = 1.055 * pow(c, vec3f(1.0 / 2.4)) - 0.055;
  return vec4f(select(hi, lo, c <= vec3f(0.0031308)), 1.0);
}
`;
// ===================== math (column-major mat4) =====================
const M4 = {
  id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b, o = new Float32Array(16)) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];

const LOGO = { frac: [0.90625, 0.63671875], mips: null, decals: [], meshes: null, uploaded: false, w: 512, h: 512 };
// decode once at startup → premultiplied RGBA mip chain on the CPU (box filter); uploaded to the GPU once in uploadScene
async function decodeLogo() {
  const blob = await (await fetch(LOGO_ATLAS_URI)).blob();
  const bmp = await createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  const w = bmp.width, h = bmp.height, cv = new OffscreenCanvas(w, h), cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(bmp, 0, 0); const src = cx.getImageData(0, 0, w, h).data;
  let lv = new Uint8Array(w * h * 4);
  for (let k = 0; k < w * h; k++) { const a = src[k * 4 + 3] / 255; lv[k * 4] = Math.round(src[k * 4] * a); lv[k * 4 + 1] = Math.round(src[k * 4 + 1] * a); lv[k * 4 + 2] = Math.round(src[k * 4 + 2] * a); lv[k * 4 + 3] = src[k * 4 + 3]; }
  const mips = [{ w, h, data: lv }]; let cw = w, ch = h;
  while (cw > 1 || ch > 1) {
    const nw = Math.max(1, cw >> 1), nh = Math.max(1, ch >> 1), nd = new Uint8Array(nw * nh * 4), pd = mips[mips.length - 1].data;
    for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) for (let c = 0; c < 4; c++) {
      const x0 = Math.min(cw - 1, x * 2), x1 = Math.min(cw - 1, x * 2 + 1), y0 = Math.min(ch - 1, y * 2), y1 = Math.min(ch - 1, y * 2 + 1);
      nd[(y * nw + x) * 4 + c] = (pd[(y0 * cw + x0) * 4 + c] + pd[(y0 * cw + x1) * 4 + c] + pd[(y1 * cw + x0) * 4 + c] + pd[(y1 * cw + x1) * 4 + c] + 2) >> 2; }
    mips.push({ w: nw, h: nh, data: nd }); cw = nw; ch = nh;
  }
  LOGO.mips = mips; LOGO.w = w; LOGO.h = h; return mips.length;
}
// variant per surface: reversed (white lettering) on dark panels, full colour on light grey / aluminium
// decided on how the surface actually renders: a metallic panel has little diffuse albedo and reads mid/dark grey under the studio
// lights (bead-blasted anodised rack panels do), so it gets the reversed lockup; painted / powder-coated light panels get full colour
function logoApparentAlbedo(mat) { const c = mat.c, L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; return L * (1 - mat.metal) + 0.15 * L * mat.metal; }
function logoVariantFor(mat) { return logoApparentAlbedo(mat) < 0.25 ? 1 : 0; }
function logoMesh(variant) {
  if (!LOGO.meshes) LOGO.meshes = [0, 1].map(row => { const g = new GB(), v0 = row * 0.5, v1 = v0 + 0.5;
    g.quad([-0.5, -0.25, 0], [0.5, -0.25, 0], [0.5, 0.25, 0], [-0.5, 0.25, 0], [[0, v1], [1, v1], [1, v0], [0, v0]]); return addMesh(g, 'fpcLogo' + row); });
  return LOGO.meshes[variant];
}

// flat decal: centre on the surface, right/up in-plane unit vectors (normal = right × up), visibleH = height of the printed lockup (m)
// group: decal rides on a moving group (centre/right/up then in that group's local frame)
function logoDecal(obj, centre, right, up, visibleH, surfMat, tag, off = 0.0015, group = 0) {

  const r = inst(logoMesh(variant), M4.basis(V3.sc(right, w), V3.sc(up, w), n, V3.add(centre, V3.sc(n, off))), MT_DECAL, { obj, shadow: false, decal: true, group });

}
